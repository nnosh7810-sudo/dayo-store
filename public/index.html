<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DAYO STORE</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.0.1/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/inter-ui@3.11.0/inter.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    .page { display: none !important; width: 100%; min-height: 100vh; }
    .page.active { display: flex !important; flex-direction: column; }
    #page-nav { z-index: 9999 !important; }
    #page-nav.active { display: flex !important; }
    .navbar-container { position: relative; z-index: 10000; }
    #page-truck { z-index: 100; }

    #page-home {
      background: radial-gradient(circle at top right, #1a1a3a 0%, #050814 50%);
      padding: 15px; padding-bottom: 100px;
    }
    .welcome-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; position: relative; z-index: 2; }
    .welcome-text h2 { margin: 0; color: white; font-size: 18px; font-weight: 700; }
    .welcome-text p { margin: 2px 0 0; color: #A0C4FF; font-size: 12px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: #111a2e; border: 1px solid #2a3b5c; border-radius: 12px;
      width: 40px; height: 40px; display: flex; justify-content: center;
      align-items: center; color: white; cursor: pointer; position: relative;
    }

    .store-badge { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; position: relative; z-index: 2; }
    .logo-icon {
      width: 45px; height: 45px;
      background: linear-gradient(135deg, #4A90E2, #8A2BE2);
      border-radius: 12px; display: flex; justify-content: center; align-items: center;
      font-weight: bold; color: white; font-size: 24px;
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
      background-size: cover; background-position: center;
    }
    .logo-text h1 { margin: 0; color: white; font-size: 18px; letter-spacing: 1px; }
    .logo-text p { margin: 0; color: #6A0DAD; font-size: 10px; letter-spacing: 3px; }

    .hero-slider {
      width: 100%; overflow: hidden; border-radius: 20px; margin-bottom: 20px;
      position: relative; background: #111a2e; border: 1px solid #2a3b5c;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2;
    }
    .hero-slider-track { display: flex; transition: transform 0.4s ease-in-out; height: 200px; }
    .hero-slide {
      min-width: 100%; position: relative; display: flex; flex-direction: column;
      justify-content: center; padding: 20px; box-sizing: border-box;
      background-size: cover; background-position: center;
    }
    .hero-slide::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(5,8,20,0.9) 0%, rgba(5,8,20,0.2) 100%);
      z-index: 1;
    }
    .hero-slide-content { position: relative; z-index: 2; }
    .slide-badge {
      background: linear-gradient(90deg, #4A90E2, #8A2BE2); color: white;
      padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: bold;
      display: inline-block; margin-bottom: 10px;
    }
    .slide-title { color: white; font-size: 22px; font-weight: 800; margin: 0 0 10px 0; line-height: 1.3; }
    .slide-btn {
      background: linear-gradient(90deg, #4A90E2, #8A2BE2); color: white; border: none;
      padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 12px;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
      gap: 5px; box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
    }
    .hero-slider-dots {
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 3;
    }
    .hero-dot {
      width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3);
      cursor: pointer; transition: 0.3s;
    }
    .hero-dot.active { background: #4A90E2; width: 24px; border-radius: 4px; }

    .hero-cta {
      display: block; width: 100%; padding: 14px;
      border-radius: 14px; border: none; cursor: pointer;
      font-weight: 800; font-size: 15px; color: white;
      background: linear-gradient(90deg, #4A90E2, #8A2BE2);
      box-shadow: 0 6px 20px rgba(138, 43, 226, 0.4);
      margin-bottom: 20px; z-index: 2; position: relative;
    }
    .hero-cta:active { transform: scale(0.98); }

    .quick-icons {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      margin-bottom: 20px; z-index: 2; position: relative;
    }
    .quick-icon {
      background: linear-gradient(180deg, #111a2e 0%, #0a101f 100%);
      border: 1px solid #1c2a45; border-radius: 16px; padding: 12px 5px;
      text-align: center; cursor: pointer; transition: transform 0.2s;
    }
    .quick-icon:active { transform: scale(0.95); }
    .quick-icon-img {
      width: 44px; height: 44px; margin: 0 auto 8px; border-radius: 12px;
      display: flex; justify-content: center; align-items: center;
      font-size: 22px; background: rgba(255,255,255,0.05); overflow: hidden;
    }
    .quick-icon-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .quick-icon-title { color: white; font-size: 11px; font-weight: 500; line-height: 1.3; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 20px; z-index: 2; position: relative;
    }
    .stat-card {
      background: rgba(17, 26, 46, 0.6); border: 1px solid #1c2a45;
      border-radius: 12px; padding: 10px 8px; text-align: center;
      backdrop-filter: blur(10px);
    }
    .stat-card .stat-icon { font-size: 18px; }
    .stat-card .stat-value { color: white; font-size: 16px; font-weight: 800; display: block; margin-top: 4px; }
    .stat-card .stat-label { color: #A0C4FF; font-size: 10px; display: block; margin-top: 2px; }

    .h-scroll-section { margin-bottom: 20px; z-index: 2; position: relative; }
    .h-scroll-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .h-scroll-header h3 { color: white; margin: 0; font-size: 15px; font-weight: 700; }
    .h-scroll-header .view-all { color: #4A90E2; font-size: 12px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 3px; }
    .h-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .h-card {
      flex-shrink: 0; width: 140px; cursor: pointer;
      background: linear-gradient(180deg, #111a2e 0%, #0a101f 100%);
      border: 1px solid #1c2a45; border-radius: 14px;
      overflow: hidden; transition: transform 0.2s; position: relative;
    }
    .h-card:active { transform: scale(0.97); }
    .h-card-img { width: 100%; height: 110px; object-fit: cover; display: block; background: #152a47; }
    .h-card-img-placeholder {
      width: 100%; height: 110px;
      display: flex; justify-content: center; align-items: center;
      color: #4A90E2; font-size: 30px;
      background: linear-gradient(135deg, #152a47, #0a101f);
    }
    .h-card-body { padding: 8px; }
    .h-card-body strong {
      color: white; font-size: 12px; display: block;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .h-card-body .price { color: #4AE2A0; font-size: 12px; font-weight: bold; margin-top: 4px; }
    .h-card-wrap { position: relative; }

    .dynamic-section {
      background: linear-gradient(180deg, #111a2e 0%, #0a101f 100%);
      border: 1px solid #1c2a45; border-radius: 16px;
      padding: 15px; margin-bottom: 20px; position: relative; z-index: 2;
    }
    .dynamic-section h2 { color: white; margin: 0 0 12px; font-size: 16px; font-weight: 700; }
    .dynamic-section p { color: #A0C4FF; font-size: 13px; line-height: 1.7; margin: 0 0 10px; }
    .dynamic-section > img { width: 100%; border-radius: 12px; margin-bottom: 10px; display: block; max-height: 200px; object-fit: cover; }
    .dynamic-section .section-btn {
      background: linear-gradient(90deg, #4A90E2, #8A2BE2); color: white;
      padding: 10px 20px; border-radius: 20px; text-decoration: none;
      font-size: 13px; font-weight: bold; display: inline-block; margin-top: 5px;
    }
    .dynamic-products { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .prod-card {
      background: #152a47; border-radius: 12px; overflow: hidden;
      border: 1px solid #2a3b5c; cursor: pointer;
    }
    .prod-card:active { transform: scale(0.97); }
    .prod-card img { width: 100%; height: 100px; object-fit: cover; display: block; }
    .prod-card .info { padding: 8px; }
    .prod-card .info strong { color: white; font-size: 12px; display: block; }
    .prod-card .info small { color: #A0C4FF; font-size: 10px; display: block; margin-top: 2px; }
    .prod-card .info .price { color: #4AE2A0; font-size: 12px; font-weight: bold; margin-top: 5px; }

    .grid-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .grid-item {
      background: linear-gradient(180deg, #111a2e 0%, #0a101f 100%);
      border: 1px solid #1c2a45; border-radius: 16px; padding: 15px 5px;
      text-align: center; cursor: pointer; transition: transform 0.2s;
    }
    .grid-item:active { transform: scale(0.95); }
    .grid-icon {
      width: 40px; height: 40px; margin: 0 auto 8px; border-radius: 10px;
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; background: rgba(255,255,255,0.05); overflow: hidden;
    }
    .grid-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .grid-title { color: white; font-size: 11px; font-weight: 500; line-height: 1.3; }

    #page-shop {
      background: radial-gradient(circle at top right, #1a1a3a 0%, #050814 50%);
      padding: 15px; padding-bottom: 100px;
    }
    .shop-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .shop-topbar h1 { color: white; margin: 0; font-size: 20px; font-weight: 800; }
    .shop-back-btn {
      background: #111a2e; border: 1px solid #2a3b5c; border-radius: 10px;
      width: 40px; height: 40px; display: flex; justify-content: center;
      align-items: center; color: white; cursor: pointer;
    }
    .shop-search-wrap { margin-bottom: 15px; }
    .shop-search {
      display: flex; align-items: center; gap: 8px;
      background: #111a2e; border: 1px solid #2a3b5c;
      border-radius: 14px; padding: 10px 14px; color: #a0c4ff;
    }
    .shop-search input { flex: 1; background: none; border: none; outline: none; color: white; font-size: 14px; font-family: inherit; }
    .shop-search input::placeholder { color: #6a7a9c; }
    .shop-search-clear {
      background: #2a3b5c; color: white; border: none;
      border-radius: 50%; width: 22px; height: 22px;
      cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center;
    }
    .shop-categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; scrollbar-width: none; }
    .shop-categories::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex-shrink: 0; background: #111a2e; border: 1px solid #2a3b5c;
      color: #a0c4ff; padding: 8px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 5px;
    }
    .cat-chip.active {
      background: linear-gradient(90deg, #4A90E2, #8A2BE2);
      color: white; border-color: transparent;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
    }
    .shop-sort-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .shop-results-count { color: #a0c4ff; font-size: 12px; }
    .shop-sort-select {
      background: #111a2e; border: 1px solid #2a3b5c;
      color: white; padding: 6px 12px; border-radius: 10px;
      font-size: 12px; font-family: inherit; cursor: pointer;
    }
    .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .shop-card {
      background: linear-gradient(180deg, #111a2e 0%, #0a101f 100%);
      border: 1px solid #1c2a45; border-radius: 16px;
      overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative;
    }
    .shop-card:active { transform: scale(0.97); }
    .shop-card .card-img-wrap { position: relative; width: 100%; height: 140px; overflow: hidden; background: #152a47; }
    .shop-card .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .shop-card .card-img-placeholder {
      width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
      color: #4A90E2; font-size: 40px; background: linear-gradient(135deg, #152a47, #0a101f);
    }
    .card-badge { position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 10px; font-size: 9px; font-weight: bold; color: white; z-index: 2; }
    .card-badge.new { background: #4AE2A0; color: #0a101f; }
    .card-badge.featured { background: #f39c12; }
    .card-badge.discount { background: #e74c3c; }
    .shop-card .card-body { padding: 10px; }
    .shop-card .card-body strong { color: white; font-size: 13px; display: block; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shop-card .card-body small { color: #A0C4FF; font-size: 10px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
    .shop-card .card-price-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .shop-card .card-price { color: #4AE2A0; font-size: 13px; font-weight: bold; }
    .shop-card .card-cat { font-size: 9px; color: #8A2BE2; background: rgba(138, 43, 226, 0.15); padding: 2px 6px; border-radius: 8px; }
    .shop-empty { text-align: center; color: #a0c4ff; font-size: 13px; padding: 40px 20px; }

    #page-product {
      background: radial-gradient(circle at top right, #1a1a3a 0%, #050814 50%);
      padding: 15px; padding-bottom: 100px;
    }
    .product-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .product-header h1 { color: white; margin: 0; font-size: 18px; font-weight: 700; }
    .product-hero { width: 100%; border-radius: 20px; overflow: hidden; background: #152a47; margin-bottom: 15px; border: 1px solid #2a3b5c; }
    .product-hero img { width: 100%; height: 240px; object-fit: cover; display: block; }
    .product-hero .hero-placeholder { width: 100%; height: 240px; display: flex; justify-content: center; align-items: center; font-size: 60px; color: #4A90E2; background: linear-gradient(135deg, #152a47, #0a101f); }
    .product-info { background: linear-gradient(180deg, #111a2e 0%, #0a101f 100%); border: 1px solid #1c2a45; border-radius: 16px; padding: 15px; margin-bottom: 15px; }
    .product-info h2 { color: white; margin: 0 0 8px; font-size: 20px; font-weight: 800; }
    .product-info p { color: #A0C4FF; font-size: 13px; line-height: 1.7; margin: 0 0 12px; }
    .product-prices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .price-chip { background: #152a47; border: 1px solid #2a3b5c; border-radius: 20px; padding: 6px 14px; font-size: 12px; color: white; }
    .price-chip strong { color: #4AE2A0; }
    .product-buy-btn {
      background: linear-gradient(90deg, #4A90E2, #8A2BE2); color: white;
      border: none; padding: 14px; border-radius: 12px;
      font-weight: bold; font-size: 15px; width: 100%; cursor: pointer;
      box-shadow: 0 6px 20px rgba(138, 43, 226, 0.4);
    }
    .product-share-btn {
      background: #111a2e; color: #a0c4ff; border: 1px solid #2a3b5c;
      padding: 10px; border-radius: 12px; font-size: 12px;
      width: 100%; margin-top: 8px; cursor: pointer;
    }

    .admin-section-card {
      background: #152a47; border-radius: 10px; padding: 12px;
      margin-bottom: 10px; display: flex; justify-content: space-between;
      align-items: flex-start; gap: 10px; flex-wrap: wrap;
    }
    .admin-section-card .info { flex: 1; min-width: 140px; }
    .admin-section-card .info strong { color: white; font-size: 14px; display: block; }
    .admin-section-card .info small { color: #a0c4ff; font-size: 11px; display: block; margin-top: 3px; }
    .admin-section-card .actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .admin-section-card .actions button {
      border: none; padding: 5px 8px; border-radius: 5px;
      cursor: pointer; font-size: 11px; color: white; white-space: nowrap;
    }
    .btn-up { background: #3498db; }
    .btn-down { background: #2980b9; }
    .btn-toggle { background: #f39c12; }
    .btn-edit { background: #8A2BE2; }
    .btn-delete { background: #e74c3c; }
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; color: white; margin-right: 5px; }
    .admin-form { background: #112238; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .admin-form h3 { margin-top: 0; color: white; font-size: 15px; }
    .admin-form label { color: #a0c4ff; font-size: 12px; display: block; margin-bottom: 4px; }
    .admin-form input[type="text"], .admin-form input[type="number"], .admin-form textarea, .admin-form select {
      width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px;
      border: none; box-sizing: border-box; font-family: inherit;
      background: #fff; color: #000;
    }
    .admin-form button.primary {
      background: #6A0DAD; color: white; padding: 12px; width: 100%;
      border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px;
    }
    .admin-form button.danger {
      background: #e74c3c; color: white; padding: 10px; width: 100%;
      border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 8px;
    }
    .item-editor { background: #0d1a2f; border: 1px solid #2a3b5c; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .item-editor .item-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .item-editor .item-row input, .item-editor .item-row select { flex: 1; min-width: 80px; margin-bottom: 0; }
    .item-editor button.remove-item { background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; width: 100%; }
    .add-item-btn { background: #3498db; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 12px; width: 100%; margin-bottom: 10px; }
    .img-preview-box {
      width: 60px; height: 60px; border-radius: 6px; background: #0d1526;
      background-size: cover; background-position: center;
      display: flex; justify-content: center; align-items: center;
      color: #666; font-size: 10px; margin-bottom: 8px;
      border: 1px dashed #2a3b5c;
    }
    .img-upload-label {
      background: #2a3b5c; color: white; padding: 8px 15px;
      border-radius: 5px; cursor: pointer; font-size: 12px;
      display: inline-block; margin-bottom: 8px;
    }
    input[type="file"].hidden-file { display: none; }
  </style>
</head>
<body>

  <!-- شاشة الشاحنة -->
  <div id="page-truck" class="page active">
    <button class="truck-button">
      <span class="default">Complete Order</span>
      <span class="success">Order Placed <svg viewbox="0 0 12 10"><polyline points="1.5 6 4.5 9 10.5 1"></polyline></svg></span>
      <div class="truck"><div class="wheel"></div><div class="back"></div><div class="front"></div><div class="box"></div></div>
    </button>
  </div>

  <!-- ✅ الرئيسية -->
  <div id="page-home" class="page">
    <div class="welcome-row">
      <div class="welcome-text">
        <h2 id="welcome-name">أهلاً 👋</h2>
        <p>وش تبي تشتري اليوم؟</p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="copyPageLink('#home')" title="مشاركة الصفحة">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        </button>
      </div>
    </div>

    <div class="store-badge">
      <div id="store-logo" class="logo-icon">D</div>
      <div class="logo-text">
        <h1 id="store-name">DAYO</h1>
        <p>STORE</p>
      </div>
    </div>

    <div class="hero-slider" id="hero-slider">
      <input type="file" id="cover-upload" accept="image/*" style="display: none;" onchange="handleCoverUpload(this)">
      <div class="hero-slider-track" id="hero-slider-track"></div>
      <div class="hero-slider-dots" id="hero-slider-dots"></div>
    </div>

    <button id="hero-cta-btn" class="hero-cta" onclick="handleInternalLink('#shop')">🛍️ تسوق الآن</button>

    <div class="quick-icons" id="quick-icons-container"></div>

    <div class="stats-grid">
      <div class="stat-card"><span class="stat-icon">👥</span><span class="stat-value" id="stat-users">0</span><span class="stat-label">مستخدم</span></div>
      <div class="stat-card"><span class="stat-icon">🟢</span><span class="stat-value" id="stat-online" style="color:#4AE2A0;">0</span><span class="stat-label">متصل</span></div>
      <div class="stat-card"><span class="stat-icon">🛍️</span><span class="stat-value" id="stat-products">0</span><span class="stat-label">منتج</span></div>
    </div>

    <div class="h-scroll-section">
      <div class="h-scroll-header">
        <h3>🔥 وصل حديثاً</h3>
        <span class="view-all" onclick="handleInternalLink('#shop')">عرض الكل ←</span>
      </div>
      <div class="h-scroll" id="new-products-scroll"></div>
    </div>

    <div class="h-scroll-section">
      <div class="h-scroll-header">
        <h3>⚡ الأكثر مبيعاً</h3>
        <span class="view-all" onclick="handleInternalLink('#shop')">عرض الكل ←</span>
      </div>
      <div class="h-scroll" id="popular-products-scroll"></div>
    </div>

    <div id="dynamic-sections-container"></div>

    <div id="hidden-logo-area" style="display: none;">
      <button id="edit-logo-btn" onclick="editLogo()">✏️</button>
      <input type="file" id="logo-upload" accept="image/*" onchange="handleLogoUpload(this)">
    </div>
  </div>

  <!-- ✅ صفحة المتجر -->
  <div id="page-shop" class="page">
    <div class="shop-topbar">
      <button class="shop-back-btn" onclick="goHome()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1>🛍️ المتجر</h1>
      <button class="shop-back-btn" onclick="copyPageLink('#shop')" title="مشاركة">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
    </div>

    <div class="shop-search-wrap">
      <div class="shop-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="shop-search-input" placeholder="ابحث عن منتج..." oninput="onShopSearch(this.value)">
        <button class="shop-search-clear" id="shop-search-clear" onclick="clearShopSearch()" style="display:none;">✕</button>
      </div>
    </div>

    <div class="shop-categories" id="shop-categories"></div>

    <div class="shop-sort-row">
      <span class="shop-results-count" id="shop-results-count">0 منتج</span>
      <select id="shop-sort" class="shop-sort-select" onchange="onShopSort(this.value)">
                <option value="newest">الأحدث</option>
        <option value="cheapest">الأرخص</option>
        <option value="expensive">الأغلى</option>
        <option value="popular">الأكثر مبيعاً</option>
      </select>
    </div>

    <div id="shop-content">
      <div class="shop-empty">جاري التحميل...</div>
    </div>
  </div>

  <!-- ✅ صفحة المنتج -->
  <div id="page-product" class="page">
    <div class="product-header">
      <button class="shop-back-btn" onclick="goHome()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1>تفاصيل المنتج</h1>
      <button class="shop-back-btn" onclick="copyCurrentProductLink()" title="مشاركة">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
    </div>
    <div id="product-content">
      <div class="shop-empty">جاري التحميل...</div>
    </div>
  </div>

  <!-- ✅ الشريط السفلي -->
  <div id="page-nav" class="page">
    <div class="navbar-container">
      <nav class="navbar" id="nav1" aria-label="Spotlight navigation"></nav>
    </div>
  </div>

  <!-- ✅ لوحة التحكم -->
  <div id="page-admin" class="page" style="background-color: #0A192F; padding: 20px; color: white; overflow-y: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="admin-title">لوحة التحكم</h2>
      <button id="close-admin" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">✕</button>
    </div>
    <div id="admin-content"></div>
  </div>

  <!-- ✅ شاشة فارغة -->
  <div id="page-empty" class="page" style="background-color: #0A192F; justify-content: center; align-items: center;">
    <div class="btn-conteiner">
      <button class="btn-content" onclick="returnToNav()">
        <span>العودة للرئيسية</span>
        <span class="icon-arrow"><svg width="66px" height="43px" viewBox="0 0 66 43"><g stroke="none" fill="none"><path d="M40.1543933,3.89485454 L40.1543933,33.6901158 C40.1543933,35.9163658 38.3583933,37.7123658 36.1323933,37.7123658 C33.9063933,37.7123658 32.1103933,35.9163658 32.1103933,33.6901158 L32.1103933,3.89485454 C32.1103933,1.66872426 33.9063933,-0.127275736 36.1323933,-0.127275736 C38.3583933,-0.127275736 40.1543933,1.66872426 40.1543933,3.89485454 Z" fill="#9ee5fa"></path><path d="M12.5,15.5 L35,15.5 C37.226,15.5 39.022,17.296 39.022,19.522 C39.022,21.748 37.226,23.544 35,23.544 L12.5,23.544 C10.274,23.544 8.478,21.748 8.478,19.522 C8.478,17.296 10.274,15.5 12.5,15.5 Z" fill="#9ee5fa"></path><path d="M28.5,33.5 L40.5,33.5 C42.726,33.5 44.522,35.296 44.522,37.522 C44.522,39.748 42.726,41.544 40.5,41.544 L28.5,41.544 C26.274,41.544 24.478,39.748 24.478,37.522 C24.478,35.296 26.274,33.5 28.5,33.5 Z" fill="#9ee5fa"></path><path d="M39.5,3.5 L14.5,28.5" stroke="#9ee5fa" stroke-width="4" stroke-linecap="round"></path><path d="M14.5,28.5 L39.5,3.5" stroke="#9ee5fa" stroke-width="4" stroke-linecap="round"></path></g></svg></span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
