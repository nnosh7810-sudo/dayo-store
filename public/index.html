<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#080e1d" />
  <meta
    name="description"
    content="DAYO STORE — متجر تيليجرام مع دعم TON Connect وTelegram Stars والدفع اليدوي."
  />
  <link rel="icon" href="/icon-180.png" />
  <title>DAYO STORE</title>

  <style>
    :root {
      --bg: #050914;
      --surface: #0d1526;
      --surface-2: #152a47;
      --text: #eaf2ff;
      --muted: #a0c4ff;
      --accent: #4a90e2;
      --accent-2: #8a2be2;
      --success: #4ae2a0;
      --warning: #f39c12;
      --danger: #e74c3c;
      --border: #243b5e;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    body[data-theme="light"] {
      --bg: #f3f6fc;
      --surface: #ffffff;
      --surface-2: #eef3fb;
      --text: #0d1726;
      --muted: #557094;
      --border: #d7e1f0;
      --shadow: 0 10px 30px rgba(15, 35, 95, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 58px;
      padding-bottom: 78px;
      overflow-x: hidden;
    }

    body.dayo-drawer-open {
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
      margin-bottom: 8px;
      font: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.12);
    }

    label {
      display: block;
      margin: 8px 0 4px;
      color: var(--muted);
      font-size: 13px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .muted,
    .dayo-muted {
      color: var(--muted);
      font-size: 12px;
    }

    .primary,
    .dayo-primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
    }

    .secondary,
    .dayo-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .danger {
      background: var(--danger);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
    }

    .dayo-warning {
      color: #ffd166;
      background: rgba(243, 156, 18, 0.12);
      border: 1px solid rgba(243, 156, 18, 0.35);
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.7;
    }

    /* Pages */
    .page {
      display: none;
      min-height: calc(100vh - 136px);
      padding: 14px;
    }

    .page.active {
      display: block;
    }

    #page-truck.active {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Topbar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: rgba(8, 14, 29, 0.84);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    body[data-theme="light"] .topbar {
      background: rgba(255, 255, 255, 0.9);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      position: relative;
      flex: 0 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    #store-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      flex: 0 0 auto;
    }

    #store-name {
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #dayo-notification-count {
      position: absolute;
      top: -5px;
      left: -5px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      display: grid;
      place-items: center;
    }

    /* Truck intro */
    .truck-button {
      position: relative;
      width: 140px;
      height: 95px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 900;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .truck-button .box {
      position: absolute;
      right: 20px;
      bottom: 26px;
      width: 30px;
      height: 23px;
      background: #fff;
      border-radius: 4px;
      transform: translateX(38px);
      opacity: 0;
    }

    .truck-button .truck {
      position: absolute;
      left: 14px;
      bottom: 20px;
      width: 56px;
      height: 30px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 7px;
    }

    .truck-button span {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
    }

    /* Hero */
    .hero {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .hero-slider-track {
      display: flex;
      transition: transform 0.45s ease;
    }

    .hero-slide {
      min-width: 100%;
      height: 230px;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: flex-end;
    }

    .hero-slide-content {
      width: 100%;
      padding: 14px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.76), transparent);
      color: #fff;
    }

    .slide-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .slide-title {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .slide-btn {
      background: #fff;
      color: #111;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 900;
    }

    .hero-slider-dots {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 2;
    }

    .hero-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
    }

    .hero-dot.active {
      width: 18px;
      background: #fff;
    }

    .hero-intro {
      padding: 14px;
    }

    .hero-intro h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    .hero-intro p {
      margin: 0;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .stat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .stat b {
      display: block;
      font-size: 16px;
      margin-bottom: 2px;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .cta {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    /* Quick icons */
    .quick-icons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .quick-icon {
      text-align: center;
    }

    .quick-icon-img {
      height: 56px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 24px;
      overflow: hidden;
    }

    .quick-icon-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .quick-icon-title {
      font-size: 11px;
      margin-top: 4px;
      color: var(--muted);
    }

    /* Home sections */
    .home-section {
      margin-bottom: 16px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .link-btn {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    .h-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .h-scroll::-webkit-scrollbar {
      display: none;
    }

    .h-card {
      min-width: 145px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .h-card-wrap {
      position: relative;
      height: 110px;
      background: var(--surface-2);
    }

    .h-card-img,
    .h-card-img-placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    .h-card-body {
      padding: 8px;
    }

    .h-card-body strong {
      display: block;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price {
      color: var(--success);
      font-size: 12px;
      margin-top: 4px;
      font-weight: 800;
    }

    .card-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 4px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      background: var(--accent);
      z-index: 2;
    }

    .card-badge.discount {
      background: var(--danger);
    }

    /* Dynamic sections */
    .dynamic-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .dynamic-section h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .dynamic-section img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    .dynamic-section p {
      color: var(--muted);
      line-height: 1.7;
    }

    .section-btn {
      margin-top: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: 800;
    }

    .grid-menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .grid-item {
      text-align: center;
    }

    .grid-icon {
      height: 52px;
      border-radius: 12px;
      background: var(--surface-2);
      display: grid;
      place-items: center;
      font-size: 22px;
      overflow: hidden;
    }

    .grid-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .grid-title {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .dynamic-products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .prod-card {
      background: var(--surface-2);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .prod-card img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      display: block;
    }

    .prod-card .info {
      padding: 8px;
    }

    .prod-card strong {
      display: block;
      font-size: 12px;
    }

    .prod-card small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin: 4px 0;
    }

    /* Page head */
    .page-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .page-head h2 {
      margin: 0;
      font-size: 18px;
      flex: 1;
    }

    .back-btn,
    .dayo-back {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 20px;
      flex: 0 0 auto;
    }

    /* Shop */
    .shop-tools {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
    }

    .search-wrap input {
      margin: 0;
      padding-inline-end: 36px;
    }

    #shop-search-clear {
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    #shop-sort {
      width: 125px;
      margin: 0;
    }

    .cat-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }

    .cat-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      white-space: nowrap;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
    }

    .cat-chip.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border-color: transparent;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .shop-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-img-wrap {
      position: relative;
      height: 130px;
      background: var(--surface-2);
    }

    .card-img,
    .card-img-placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: grid;
      place-items: center;
      font-size: 34px;
    }

    .card-body {
      padding: 9px;
    }

    .card-body strong {
      display: block;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-body small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin: 4px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .card-price {
      color: var(--success);
      font-weight: 900;
      font-size: 12px;
    }

    .card-cat {
      color: var(--muted);
      font-size: 10px;
    }

    .shop-empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 10px;
    }

    /* Product page */
    .product-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .product-hero img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .hero-placeholder {
      height: 240px;
      display: grid;
      place-items: center;
      font-size: 48px;
      background: var(--surface-2);
    }

    .product-info {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .product-info h2 {
      margin: 6px 0;
    }

    .product-info p {
      color: var(--muted);
      line-height: 1.8;
    }

    .product-prices {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .price-chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .product-buy-btn,
    .product-share-btn {
      width: 100%;
      margin-top: 8px;
      border-radius: 14px;
      padding: 12px;
      font-weight: 900;
    }

    .product-buy-btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    .product-share-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    /* Admin */
    .admin-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .admin-form h3,
    .admin-form h4 {
      margin-top: 0;
    }

    .admin-section-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .admin-section-card .info {
      min-width: 0;
    }

    .admin-section-card strong {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-section-card small {
      color: var(--muted);
      font-size: 11px;
    }

    .actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .btn-up,
    .btn-down,
    .btn-toggle,
    .btn-edit,
    .btn-delete {
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .btn-delete {
      background: rgba(231, 76, 60, 0.15);
      border-color: rgba(231, 76, 60, 0.35);
      color: #ff8f8f;
    }

    .type-badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 999px;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
    }

    .item-editor {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .remove-item {
      color: var(--danger);
      font-weight: 800;
      margin-top: 4px;
    }

    .img-preview-box,
    #qi-image-preview,
    #slider-preview,
    #image-preview,
    #sec-img-preview {
      width: 82px;
      height: 52px;
      border-radius: 10px;
      background: var(--surface-2);
      background-size: cover;
      background-position: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 10px;
      vertical-align: middle;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .img-upload-label {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      margin: 4px 0;
    }

    .hidden-file {
      display: none;
    }

    .add-item-btn {
      width: 100%;
      background: var(--surface-2);
      border: 1px dashed var(--border);
      padding: 10px;
      border-radius: 10px;
      font-weight: 800;
    }

    .dayo-payment-note {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin: 10px 0;
    }

    .dayo-payment-note strong {
      display: block;
      margin-bottom: 6px;
    }

    .dayo-payment-note p {
      margin: 6px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      word-break: break-all;
    }

    /* ===== Admin Dashboard Grid ===== */
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .admin-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 8px;
      min-height: 98px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.18s ease;
      color: var(--text);
      text-align: center;
    }

    .admin-tile:hover,
    .admin-tile:active {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .admin-tile-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: linear-gradient(
        135deg,
        rgba(74, 144, 226, 0.18),
        rgba(138, 43, 226, 0.18)
      );
    }

    .admin-tile-title {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--text);
    }

    .admin-section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .admin-section-head h3 {
      margin: 0;
      flex: 1;
      font-size: 17px;
      color: var(--text);
    }

    .admin-loading {
      padding: 40px 12px;
      text-align: center;
      color: var(--muted);
    }

    @media (min-width: 520px) {
      .admin-grid {
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      }
    }

    /* Cart / orders / dynamic pages */
    .dayo-page-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .dayo-page-head h2 {
      margin: 0;
      font-size: 18px;
      flex: 1;
    }

    .dayo-cart-list {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .dayo-cart-item {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
    }

    .dayo-cart-image {
      width: 62px;
      height: 62px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--surface-2);
      flex: 0 0 auto;
    }

    .dayo-cart-placeholder {
      display: grid;
      place-items: center;
      font-size: 24px;
    }

    .dayo-cart-info {
      flex: 1;
      min-width: 0;
    }

    .dayo-cart-info strong {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dayo-quantity {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .dayo-quantity button {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .dayo-quantity .dayo-remove {
      width: auto;
      padding: 0 8px;
      color: var(--danger);
      font-size: 11px;
    }

    .dayo-line-total {
      white-space: nowrap;
      color: var(--success);
    }

    .dayo-checkout-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .dayo-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      font-weight: 900;
    }

    .dayo-empty-cart {
      text-align: center;
      padding: 50px 12px;
    }

    .dayo-empty-cart div:first-child {
      font-size: 52px;
      margin-bottom: 8px;
    }

    .dayo-empty-cart h3 {
      margin: 0 0 6px;
    }

    .dayo-empty-cart p {
      color: var(--muted);
      margin: 0 0 14px;
    }

    .dayo-order-success {
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .dayo-success-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 10px;
      border-radius: 999px;
      background: rgba(74, 226, 160, 0.15);
      color: var(--success);
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 900;
    }

    .dayo-order-code {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      margin: 8px 0;
      letter-spacing: 0.5px;
      direction: ltr;
    }

    .dayo-checkout-link {
      display: inline-block;
      margin: 8px 0;
      text-decoration: none;
    }

    .dayo-orders-list {
      display: grid;
      gap: 8px;
    }

    .dayo-order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .dayo-order-card-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .dayo-status {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      white-space: nowrap;
    }

    .status-paid,
    .status-completed {
      color: var(--success);
    }

    .status-awaiting_payment {
      color: var(--warning);
    }

    .status-cancelled,
    .status-rejected {
      color: var(--danger);
    }

    .dayo-order-lines {
      margin: 8px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .dayo-page-loading {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    /* Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 80;
    }

    .drawer-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      right: 0;
      width: min(320px, 85vw);
      background: var(--surface);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: 0.25s ease;
      z-index: 90;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-head strong {
      flex: 1;
    }

    .drawer-links {
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    .drawer-links button {
      text-align: right;
      padding: 12px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-weight: 800;
    }

    .notifications-list {
      padding: 10px;
      overflow: auto;
      display: grid;
      gap: 8px;
    }

    .dayo-notification-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      text-align: right;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      width: 100%;
    }

    .dayo-notification-item.unread {
      border-color: var(--accent);
      background: rgba(74, 144, 226, 0.08);
    }

    .dayo-notification-icon {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--surface);
      flex: 0 0 auto;
      font-weight: 900;
    }

    .type-success {
      color: var(--success);
    }

    .type-warning {
      color: var(--warning);
    }

    .type-offer {
      color: var(--accent-2);
    }

    .dayo-notification-copy {
      flex: 1;
      min-width: 0;
    }

    .dayo-notification-copy strong {
      display: block;
      font-size: 13px;
    }

    .dayo-notification-copy small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin: 3px 0;
      line-height: 1.6;
    }

    .dayo-notification-copy time {
      color: var(--muted);
      font-size: 10px;
    }

    .dayo-unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      flex: 0 0 auto;
      margin-top: 8px;
    }

    .dayo-notifications-empty {
      text-align: center;
      padding: 40px 10px;
      color: var(--muted);
    }

    /* Bottom navigation */
    #page-nav {
      display: none;
    }

    #page-nav.active {
      display: block;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: rgba(8, 14, 29, 0.94);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 70;
      padding-bottom: env(safe-area-inset-bottom);
    }

    body[data-theme="light"] .bottom-nav {
      background: rgba(255, 255, 255, 0.96);
    }

    .nav-item {
      position: relative;
      width: 20%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
    }

    .nav-item.active {
      color: var(--accent);
    }

    .active-icon {
      filter: drop-shadow(0 0 8px rgba(74, 144, 226, 0.45));
    }

    .active-indicator {
      position: absolute;
      bottom: 10px;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
      transform: translateX(-50%);
      transition: 0.25s ease;
    }

    .spotlight {
      position: absolute;
      top: 0;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(74, 144, 226, 0.22), transparent 70%);
      transform: translateX(-50%);
      transition: 0.25s ease;
      pointer-events: none;
    }

    /* Empty page */
    .empty-center {
      min-height: 60vh;
      display: grid;
      place-items: center;
      text-align: center;
      gap: 10px;
    }

    /* Loader */
    .custom-loader-wrapper {
      display: grid;
      place-items: center;
      min-height: 50vh;
    }

    .loader {
      text-align: center;
      color: var(--muted);
    }

    .loader-text {
      margin-bottom: 10px;
    }

    .load {
      display: inline-block;
      width: 42px;
      height: 42px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 999px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Responsive */
    @media (min-width: 520px) {
      .shop-grid,
      .dynamic-products {
        grid-template-columns: repeat(3, 1fr);
      }

      .quick-icons,
      .grid-menu {
        grid-template-columns: repeat(6, 1fr);
      }
    }
  </style>
</head>

<body data-theme="dark">
  <!-- Topbar -->
  <header class="topbar">
    <button class="icon-btn" onclick="openSideMenu()" aria-label="القائمة">☰</button>

    <div class="brand">
      <div id="store-logo">D</div>
      <strong id="store-name">DAYO STORE</strong>
    </div>

    <div class="top-actions">
      <button id="theme-toggle" class="icon-btn" onclick="toggleTheme()" aria-label="تبديل المظهر">
        ☀️
      </button>

      <button class="icon-btn" onclick="openNotifications()" aria-label="الإشعارات">
        🔔
        <span id="dayo-notification-count" class="hidden">0</span>
      </button>
    </div>
  </header>

  <!-- Truck / Intro page -->
  <section id="page-truck" class="page active">
    <button class="truck-button" type="button">
      <div class="box"></div>
      <div class="truck"></div>
      <span>بدء</span>
    </button>
  </section>

  <!-- Home page -->
  <section id="page-home" class="page">
    <div class="hero">
      <div id="hero-slider-track" class="hero-slider-track"></div>
      <div id="hero-slider-dots" class="hero-slider-dots"></div>

      <div class="hero-intro">
        <h1 id="welcome-name">أهلاً 👋</h1>
        <p>وش تبي تشتري اليوم؟</p>

        <div class="stats">
          <div class="stat">
            <b id="stat-users">0</b>
            <span>👥 مستخدم</span>
          </div>
          <div class="stat">
            <b id="stat-online">0</b>
            <span>🟢 متصل الآن</span>
          </div>
          <div class="stat">
            <b id="stat-products">0</b>
            <span>🛍️ منتج</span>
          </div>
        </div>

        <button id="hero-cta-btn" class="cta" type="button">🛍️ تسوق الآن</button>
      </div>
    </div>

    <div id="quick-icons-container" class="quick-icons"></div>

    <section class="home-section">
      <div class="section-head">
        <h2>🔥 وصل حديثاً</h2>
        <button class="link-btn" onclick="openShop()">عرض الكل ←</button>
      </div>
      <div id="new-products-scroll" class="h-scroll"></div>
    </section>

    <section class="home-section">
      <div class="section-head">
        <h2>⚡ الأكثر مبيعاً</h2>
        <button class="link-btn" onclick="openShop()">عرض الكل ←</button>
      </div>
      <div id="popular-products-scroll" class="h-scroll"></div>
    </section>

    <div id="dynamic-sections-container"></div>
  </section>

  <!-- Shop page -->
  <section id="page-shop" class="page">
    <div class="page-head">
      <button class="back-btn" onclick="goHome()">‹</button>
      <h2>🛍️ المتجر</h2>
    </div>

    <div class="shop-tools">
      <div class="search-wrap">
        <input
          id="shop-search-input"
          type="search"
          placeholder="ابحث عن منتج..."
          oninput="onShopSearch(this.value)"
        />
        <button id="shop-search-clear" type="button" onclick="clearShopSearch()">✕</button>
      </div>

      <select id="shop-sort" onchange="onShopSort(this.value)">
        <option value="newest">الأحدث</option>
        <option value="cheapest">الأرخص</option>
        <option value="expensive">الأغلى</option>
        <option value="popular">الأكثر مبيعاً</option>
      </select>
    </div>

    <div id="shop-categories" class="cat-bar"></div>
    <div id="shop-results-count" class="muted"></div>
    <div id="shop-content" class="shop-content"></div>
  </section>

  <!-- Product page -->
  <section id="page-product" class="page">
    <div class="page-head">
      <button class="back-btn" onclick="goHome()">‹</button>
      <h2>تفاصيل المنتج</h2>
      <button class="icon-btn" onclick="copyCurrentProductLink()" aria-label="نسخ رابط المنتج">
        🔗
      </button>
    </div>

    <div id="product-content"></div>
  </section>

  <!-- Dynamic page used by cart/orders -->
  <section id="page-dayo-dynamic" class="page dayo-dynamic-page"></section>

  <!-- Admin page -->
  <section id="page-admin" class="page">
    <div class="page-head">
      <h2>لوحة التحكم</h2>
      <button id="close-admin" class="icon-btn" type="button">✕</button>
    </div>

    <div id="admin-content"></div>
  </section>

  <!-- Empty page after closing admin -->
  <section id="page-empty" class="page">
    <div class="empty-center">
      <h2>تم إغلاق لوحة التحكم</h2>
      <button class="primary" onclick="returnToNav()">العودة للرئيسية</button>
    </div>
  </section>

  <!-- Bottom navigation wrapper -->
  <div id="page-nav">
    <nav id="nav1" class="bottom-nav"></nav>
  </div>

  <!-- Side drawer -->
  <div id="dayo-menu-overlay" class="drawer-overlay" onclick="closeSideMenu()"></div>

  <aside id="dayo-side-drawer" class="drawer">
    <div id="dayo-drawer-main" class="drawer-view">
      <div class="drawer-head">
        <strong>DAYO</strong>
        <button class="icon-btn" onclick="closeSideMenu()">✕</button>
      </div>

      <div class="drawer-links">
        <button onclick="drawerNavigate('home')">🏠 الرئيسية</button>
        <button onclick="drawerNavigate('shop')">🛍️ المتجر</button>
        <button onclick="drawerNavigate('cart')">🛒 سلة المشتريات</button>
        <button onclick="drawerNavigate('orders')">🧾 طلباتي</button>
        <button onclick="drawerNavigate('admin')">⚙️ لوحة التحكم</button>
        <button onclick="openNotifications()">🔔 الإشعارات</button>
      </div>
    </div>

    <div id="dayo-drawer-notifications" class="drawer-view hidden">
      <div class="drawer-head">
        <button class="icon-btn" onclick="showDrawerMenu()">‹</button>
        <strong>الإشعارات</strong>
        <button class="icon-btn" onclick="loadNotificationCount()">↻</button>
      </div>

      <div id="dayo-notifications-list" class="notifications-list"></div>
    </div>
  </aside>

  <!-- Hidden upload inputs used by owner store settings -->
  <input
    type="file"
    id="cover-upload"
    accept="image/*"
    class="hidden-file"
    onchange="handleCoverUpload(this)"
  />
  <input
    type="file"
    id="logo-upload"
    accept="image/*"
    class="hidden-file"
    onchange="handleLogoUpload(this)"
  />

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- GSAP optional for truck animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- TON Connect UI -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <script>
    // Compatibility shim: some builds may expose different globals.
    window.TON_CONNECT_UI = window.TON_CONNECT_UI || window.tonconnect || {};
  </script>

  <!-- Application -->
  <script src="/app.js"></script>
</body>
</html>
