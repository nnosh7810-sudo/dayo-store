<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تطبيقي المصغر</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.0.1/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/inter-ui@3.11.0/inter.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الصفحة الأولى: الشاحنة -->
  <div id="page-truck" class="page active">
    <button class="truck-button">
      <span class="default">Complete Order</span>
      <span class="success">
        Order Placed
        <svg viewbox="0 0 12 10"><polyline points="1.5 6 4.5 9 10.5 1"></polyline></svg>
      </span>
      <div class="truck">
        <div class="wheel"></div><div class="back"></div><div class="front"></div><div class="box"></div>
      </div>
    </button>
  </div>

  <!-- الصفحة الرئيسية (الهيدر) -->
  <div id="page-home" class="page" style="background-color: #050814; padding: 15px; overflow-y: auto; padding-bottom: 100px;">
    
    <!-- الهيدر -->
    <div style="position: relative; margin-bottom: 60px;">
      <!-- مستطيل الغلاف -->
      <div id="store-cover" style="width: 100%; height: 150px; background: #111a2e; border-radius: 16px; background-image: url(''); background-size: cover; background-position: center; position: relative; border: 1px solid #1c2a45;">
        <!-- زر قلم الغلاف (للمالك فقط) -->
        <button id="edit-cover-btn" onclick="editCover()" style="display: none; position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 8px; padding: 8px; cursor: pointer;">
          ✏️
        </button>
        <!-- حقل مخفي لاختيار صورة الغلاف -->
        <input type="file" id="cover-upload" accept="image/*" style="display: none;" onchange="handleCoverUpload(this)">
      </div>

      <!-- الدائرة (اللوجو) -->
      <div id="store-logo" style="position: absolute; bottom: -40px; right: 20px; width: 80px; height: 80px; background: #0d1526; border: 3px solid #050814; border-radius: 50%; display: flex; justify-content: center; align-items: center; background-image: url(''); background-size: cover; background-position: center;">
        <!-- زر قلم اللوجو (للمالك فقط) -->
        <button id="edit-logo-btn" onclick="editLogo()" style="display: none; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 12px; cursor: pointer;">
          ✏️
        </button>
        <!-- حقل مخفي لاختيار صورة اللوجو -->
        <input type="file" id="logo-upload" accept="image/*" style="display: none;" onchange="handleLogoUpload(this)">
      </div>

      <!-- اسم المتجر والأرقام -->
      <div style="position: absolute; bottom: -45px; right: 110px;">
        <h2 id="store-name" style="color: white; margin: 0; font-size: 20px; letter-spacing: 1px;">DAYO STORE</h2>
        <div style="display: flex; gap: 10px; margin-top: 5px;">
          <span style="color: #A0C4FF; font-size: 11px; display: flex; align-items: center; gap: 3px;">
            👥 <span id="store-users">12,846</span> مستخدم
          </span>
          <span style="color: #4AE2A0; font-size: 11px; display: flex; align-items: center; gap: 3px;">
            🟢 <span id="store-online">1,245</span> متصل
          </span>
        </div>
      </div>
    </div>

    <!-- مساحة فارغة حالياً -->
    <div style="text-align: center; color: #A0C4FF; margin-top: 50px;">
      <p>مرحباً بك في المتجر!</p>
    </div>

  </div>

  <!-- الصفحة الثانية: الشريط الداكن -->
  <div id="page-nav" class="page">
    <div class="navbar-container">
      <nav class="navbar" id="nav1" aria-label="Spotlight navigation"></nav>
    </div>
  </div>

  <!-- الصفحة الثالثة: لوحة التحكم -->
  <div id="page-admin" class="page" style="background-color: #0A192F; padding: 20px; color: white; overflow-y: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="admin-title">لوحة التحكم</h2>
      <button id="close-admin" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">✕</button>
    </div>
    
    <div id="admin-content">
      <p>جاري تحميل الصلاحيات...</p>
    </div>
  </div>

  <!-- الصفحة الرابعة: الشاشة التي تحتوي على زر العودة -->
  <div id="page-empty" class="page" style="background-color: #0A192F; justify-content: center; align-items: center;">
    <div class="btn-conteiner">
      <button class="btn-content" onclick="returnToNav()">
        <span>العودة للرئيسية</span>
        <span class="icon-arrow">
          <svg width="66px" height="43px" viewBox="0 0 66 43" version="1.1" xmlns="http://www.w3.org/2000/svg">
            <g id="arrow" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
              <path id="arrow-icon-one" d="M40.1543933,3.89485454 L40.1543933,33.6901158 C40.1543933,35.9163658 38.3583933,37.7123658 36.1323933,37.7123658 C33.9063933,37.7123658 32.1103933,35.9163658 32.1103933,33.6901158 L32.1103933,3.89485454 C32.1103933,1.66872426 33.9063933,-0.127275736 36.1323933,-0.127275736 C38.3583933,-0.127275736 40.1543933,1.66872426 40.1543933,3.89485454 Z" fill="#9ee5fa"></path>
              <path id="arrow-icon-two" d="M12.5,15.5 L35,15.5 C37.226,15.5 39.022,17.296 39.022,19.522 C39.022,21.748 37.226,23.544 35,23.544 L12.5,23.544 C10.274,23.544 8.478,21.748 8.478,19.522 C8.478,17.296 10.274,15.5 12.5,15.5 Z" fill="#9ee5fa"></path>
              <path id="arrow-icon-three" d="M28.5,33.5 L40.5,33.5 C42.726,33.5 44.522,35.296 44.522,37.522 C44.522,39.748 42.726,41.544 40.5,41.544 L28.5,41.544 C26.274,41.544 24.478,39.748 24.478,37.522 C24.478,35.296 26.274,33.5 28.5,33.5 Z" fill="#9ee5fa"></path>
              <path id="arrow-icon-four" d="M39.5,3.5 L14.5,28.5" stroke="#9ee5fa" stroke-width="4" stroke-linecap="round"></path>
              <path id="arrow-icon-five" d="M14.5,28.5 L39.5,3.5" stroke="#9ee5fa" stroke-width="4" stroke-linecap="round"></path>
            </g>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
